  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Balloons 🎈</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(180deg, #b9efff 0%, #e8fbff 62%, #fff8ee 100%);
      position: relative;
    }
    .sun {
      position: absolute; top: 7%; right: 9%;
      width: clamp(55px, 9vw, 115px); aspect-ratio: 1;
      border-radius: 50%; background: #fff3a6;
      box-shadow: 0 0 55px 18px rgba(255, 235, 140, .35);
    }
    .cloud {
      position: absolute; bottom: -25px; height: 100px; width: 260px;
      background: rgba(255,255,255,.75); border-radius: 100px;
      filter: blur(1px);
    }
    .cloud::before, .cloud::after {
      content: ""; position: absolute; background: inherit; border-radius: 50%;
    }
    .cloud::before { width: 115px; height: 115px; left: 35px; bottom: 20px; }
    .cloud::after { width: 145px; height: 145px; right: 28px; bottom: 5px; }
    .cloud.c1 { left: -60px; }
    .cloud.c2 { right: -70px; transform: scale(.85); bottom: -38px; }
    .cloud.c3 { left: 35%; transform: scale(.65); bottom: -55px; }
    .title {
      position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
      width: max-content; max-width: 90vw; text-align: center;
      color: #28556d; font-size: clamp(18px, 3vw, 30px);
      font-weight: 800; letter-spacing: .4px;
      text-shadow: 0 2px 0 rgba(255,255,255,.75);
      pointer-events: none; z-index: 2;
    }
    .subtitle {
      display: block; margin-top: 4px; font-size: clamp(11px, 1.5vw, 14px);
      font-weight: 500; letter-spacing: 0;
    }
    #sky { position: absolute; inset: 0; overflow: hidden; }
    .balloon {
      position: absolute; bottom: -180px; width: var(--size); height: calc(var(--size) * 1.22);
      border-radius: 50% 50% 46% 46%;
      background: var(--color);
      opacity: .94;
      box-shadow: inset calc(var(--size) * -.09) calc(var(--size) * -.06) 0 rgba(0,0,0,.09),
                  inset calc(var(--size) * .12) calc(var(--size) * .08) 0 rgba(255,255,255,.22),
                  0 7px 13px rgba(30, 90, 120, .10);
      animation: rise var(--duration) linear forwards;
      will-change: transform, bottom;
    }
    .balloon { cursor: pointer; touch-action: manipulation; }
    .balloon::before {
      content: ""; position: absolute; width: 22%; height: 12%;
      left: 24%; top: 13%; border-radius: 50%; background: rgba(255,255,255,.52);
      transform: rotate(-35deg);
    }
    .balloon.burst {
      pointer-events: none;
      animation: pop .22s ease-out forwards !important;
    }
    @keyframes pop {
      0% { opacity: 1; transform: scale(1); }
      55% { opacity: .9; transform: scale(1.35); }
      100% { opacity: 0; transform: scale(.05); }
    }
    .pop-piece {
      position: absolute; left: 50%; top: 50%; width: 7px; height: 7px;
      border-radius: 50%; background: var(--color); pointer-events: none;
      animation: pop-piece .45s ease-out forwards;
    }
    @keyframes pop-piece {
      from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      to { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(.2); }
    }
    .balloon::after {
      content: ""; position: absolute; left: 42%; bottom: -5%;
      width: 16%; height: 8%; background: var(--color);
      clip-path: polygon(50% 100%, 0 0, 100% 0);
      filter: brightness(.86);
    }
    .string {
      position: absolute; left: 50%; top: 100%; width: 1.5px; height: calc(var(--size) * .52);
      background: rgba(80, 100, 120, .65); transform-origin: top;
      animation: sway 1.8s ease-in-out infinite alternate;
    }
    @keyframes rise {
      0% { transform: translate3d(0, 0, 0) rotate(-5deg); }
      25% { transform: translate3d(var(--drift), -25vh, 0) rotate(4deg); }
      55% { transform: translate3d(calc(var(--drift) * -.55), -60vh, 0) rotate(-4deg); }
      100% { transform: translate3d(var(--drift), -125vh, 0) rotate(5deg); }
    }
    @keyframes sway { from { transform: rotate(-13deg); } to { transform: rotate(13deg); } }
    .controls {
      position: absolute; z-index: 3; left: 50%; bottom: 18px; transform: translateX(-50%);
      display: flex; gap: 10px; align-items: center; justify-content: center;
      width: max-content; max-width: 94vw; flex-wrap: wrap;
    }
    button {
      border: 0; border-radius: 999px; padding: 11px 18px; cursor: pointer;
      font: inherit; font-weight: 700; color: #214b62; background: rgba(255,255,255,.88);
      box-shadow: 0 5px 18px rgba(35, 100, 130, .15);
      transition: transform .15s ease, background .15s ease;
    }
    button:hover { transform: translateY(-2px); background: white; }
    button:focus-visible { outline: 3px solid #28556d; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      .balloon { animation-duration: 18s !important; }
      .string { animation: none; }
    }
  </style>

  <div class="controls">
    <button id="more" type="button">＋ Add balloons</button>
    <button id="pause" type="button" aria-pressed="false">Ⅱ Pause</button>
  </div>
  <script>
    const sky = document.getElementById('sky');
    const colors = ['#ff5b75', '#ff9f1c', '#ffd93d', '#56cfe1', '#4d96ff', '#8b5cf6', '#35c96f', '#ff70c8', '#ff6b35'];
    let paused = false;
    let spawnTimer;

    function makeBalloon(startImmediately = false) {
      const balloon = document.createElement('div');
      balloon.className = 'balloon';
      const size = 34 + Math.random() * 48;
      const duration = 7 + Math.random() * 9;
      const drift = (Math.random() * 2 - 1) * Math.min(90, window.innerWidth * 0.09);
      balloon.style.left = `${Math.random() * 96}%`;
      balloon.style.setProperty('--size', `${size}px`);
      balloon.style.setProperty('--color', colors[Math.floor(Math.random() * colors.length)]);
      balloon.style.setProperty('--duration', `${duration}s`);
      balloon.style.setProperty('--drift', `${drift}px`);
      if (startImmediately) balloon.style.bottom = `${Math.random() * 90 - 10}vh`;
      const string = document.createElement('span');
      string.className = 'string';
      balloon.appendChild(string);
      sky.appendChild(balloon);
      balloon.addEventListener('click', (event) => {
        if (balloon.classList.contains('burst')) return;
        event.stopPropagation();
        balloon.classList.add('burst');
        // Small colorful burst particles for a fun pop effect.
        for (let i = 0; i < 8; i++) {
          const piece = document.createElement('span');
          piece.className = 'pop-piece';
          const angle = (Math.PI * 2 * i) / 8;
          const distance = 28 + Math.random() * 28;
          piece.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
          piece.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
          balloon.appendChild(piece);
        }
        setTimeout(() => balloon.remove(), 500);
      });
      balloon.addEventListener('animationend', (event) => {
        if (event.animationName === 'rise' || event.animationName === 'pop') balloon.remove();
      });
    }

    function startBalloons() {
      for (let i = 0; i < 16; i++) {
        setTimeout(() => makeBalloon(true), i * 180);
      }
      spawnTimer = setInterval(() => {
        if (!paused) makeBalloon();
      }, 420);
    }

    document.getElementById('more').addEventListener('click', () => {
      for (let i = 0; i < 8; i++) setTimeout(() => makeBalloon(true), i * 90);
    });

    document.getElementById('pause').addEventListener('click', (event) => {
      paused = !paused;
      sky.querySelectorAll('.balloon').forEach(b => b.style.animationPlayState = paused ? 'paused' : 'running');
      event.currentTarget.textContent = paused ? '▶ Resume' : 'Ⅱ Pause';
      event.currentTarget.setAttribute('aria-pressed', String(paused));
    });

    startBalloons();
  </script>
